name: Build and Publish Caddy with Cloudflare Plugin

on:
  # 手动触发,可指定 Caddy 版本
  workflow_dispatch:
    inputs:
      caddy_version:
        description: "Caddy version (e.g. 2.8.4). Leave empty to use latest stable."
        required: false
        default: ""
      force_build:
        description: "Force build even if image tag already exists"
        type: boolean
        required: false
        default: false
  # 定期检查:每周日 00:00 UTC 获取 Docker Hub 最新稳定版, GHCR 中已存在该版本时自动跳过
  schedule:
    - cron: "0 0 * * 0"
  # 主分支推送时构建
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".github/workflows/build.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ===== 检查 Docker Hub 上最新稳定版 Caddy =====
  check-version:
    runs-on: ubuntu-latest
    outputs:
      caddy_version: ${{ steps.get_version.outputs.caddy_version }}
      should_build: ${{ steps.check_existing.outputs.should_build }}
    steps:
      - name: Get latest stable Caddy version from Docker Hub
        id: get_version
        run: |
          # 优先使用手动输入的版本号
          if [ -n "${{ github.event.inputs.caddy_version }}" ]; then
            VERSION="${{ github.event.inputs.caddy_version }}"
            # 去掉可能的前缀 v
            VERSION="${VERSION#v}"
          else
            # 从 Docker Hub library/caddy 的镜像 tag 解析最新完整版本号
            # 镜像 tag 即真实发布的镜像版本, 避免 git tag 高于已发布镜像导致拉取基础镜像失败
            VERSION=$(curl -fsSL "https://hub.docker.com/v2/repositories/library/caddy/tags?page_size=100" \
              | jq -r '[.results[].name | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))] | sort_by(split(".") | map(tonumber)) | last')
            if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
              echo "Failed to fetch latest Caddy version from Docker Hub"
              exit 1
            fi
          fi

          # 校验 Dockerfile 依赖的基础镜像 tag 真实存在(-builder 与 -alpine)
          for SUFFIX in builder alpine; do
            if ! curl -fsSL -o /dev/null "https://hub.docker.com/v2/repositories/library/caddy/tags/${VERSION}-${SUFFIX}"; then
              echo "::error::caddy:${VERSION}-${SUFFIX} does not exist on Docker Hub"
              exit 1
            fi
          done

          echo "caddy_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "::notice::Resolved Caddy version: $VERSION"

      - name: Determine if build is needed
        id: check_existing
        run: |
          VERSION="${{ steps.get_version.outputs.caddy_version }}"
          IMAGE="${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"

          # 强制构建:手动触发且 force_build=true 时直接构建
          if [ "${{ github.event.inputs.force_build }}" = "true" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Force build requested, will build"
            exit 0
          fi

          # push 触发意味着 Dockerfile 或 workflow 有变更, 直接重新构建
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Triggered by push, will build"
            exit 0
          fi

          # schedule / 手动触发: GHCR 中该版本 tag 已存在则跳过, 避免重复构建相同版本
          if docker manifest inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Image ${IMAGE}:${VERSION} already exists, skipping build"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Image ${IMAGE}:${VERSION} does not exist, will build"
          fi

  # ===== 构建多架构 Docker 镜像并推送到 GHCR =====
  build-and-push:
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.check-version.outputs.caddy_version }}
            type=raw,value=cloudflare-${{ needs.check-version.outputs.caddy_version }}
          labels: |
            org.opencontainers.image.title=Caddy with Cloudflare DNS plugin
            org.opencontainers.image.description=Custom Caddy build with caddy-dns/cloudflare plugin
            org.opencontainers.image.version=${{ needs.check-version.outputs.caddy_version }}

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CADDY_VERSION=${{ needs.check-version.outputs.caddy_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Generate build summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Caddy version**: \`${{ needs.check-version.outputs.caddy_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Plugin**: \`github.com/caddy-dns/cloudflare\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Platforms**: \`linux/amd64\`, \`linux/arm64\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry**: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tags**:" >> $GITHUB_STEP_SUMMARY
          echo "  - \`latest\`" >> $GITHUB_STEP_SUMMARY
          echo "  - \`${{ needs.check-version.outputs.caddy_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "  - \`cloudflare-${{ needs.check-version.outputs.caddy_version }}\`" >> $GITHUB_STEP_SUMMARY
